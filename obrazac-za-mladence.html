    <main>
      <section class="obrazac-section">
        <div class="obrazac-container">
          <h1 class="obrazac-naslov">Obrazac za mladence</h1>
          <form id="mladenci-form" autocomplete="off">
            <!-- Grupa: Datum svatova i Vrijeme večere u istom redu -->
            <div class="form-row">
              <div class="form-group">
                <label for="datum">Datum svatova</label>
                <input
                  type="text"
                  id="datum"
                  name="datum"
                  required
                  readonly
                  aria-label="Odaberite datum"
                  style="text-align: center"
                />
              </div>
              <div class="form-group">
                <label for="vrijeme-vecere">Vrijeme večere</label>
                <input
                  type="text"
                  id="vrijeme-vecere"
                  name="vrijeme-vecere"
                  required
                  maxlength="5"
                  pattern="^([01][0-9]|2[0-3]):[0-5][0-9]$"
                  placeholder="hh:mm"
                  autocomplete="off"
                  inputmode="numeric"
                  value=""
                />
              </div>
            </div>
            <!-- Grupa: Grad i Svadbeni salon u istom redu -->
            <div class="form-row">
              <div class="form-group">
                <label for="grad">Grad</label>
                <input
                  type="text"
                  id="grad"
                  name="grad"
                  maxlength="60"
                  required
                />
              </div>
              <div class="form-group">
                <label for="sala">Svadbeni salon</label>
                <input
                  type="text"
                  id="sala"
                  name="sala"
                  maxlength="80"
                  required
                />
              </div>
            </div>
            <!-- Grupa: Ime i prezime mlade u istom redu -->
            <div class="form-row">
              <div class="form-group">
                <label for="mlada">Ime i prezime mlade</label>
                <input
                  type="text"
                  id="mlada"
                  name="mlada"
                  maxlength="60"
                  required
                />
              </div>
              <div class="form-group">
                <label for="mladozenja">Ime i prezime mladoženje</label>
                <input
                  type="text"
                  id="mladozenja"
                  name="mladozenja"
                  maxlength="60"
                  required
                />
              </div>
            </div>
            <div id="ulaz-odabir-container" class="form-group">
              <label
                style="color: #ffe066; font-weight: 600; margin-bottom: 8px"
                >Odaberite tko ulazi u salu i odredite redoslijed ulaska:</label
              >
              <ul id="ulaz-lista" class="ulaz-lista">
                <li data-id="barjaktar">
                  <input type="checkbox" id="barjaktar" />
                  <label for="barjaktar">Barjaktar</label>
                  <div class="pjesme-polja"></div>
                </li>
                <li data-id="kumovi">
                  <input type="checkbox" id="kumovi" />
                  <label for="kumovi">Kumovi</label>
                  <div class="pjesme-polja"></div>
                </li>
                <li data-id="drugi">
                  <input type="checkbox" id="drugi" />
                  <label for="drugi">Drugi (navedite)</label>
                  <div class="pjesme-polja"></div>
                </li>
                <li data-id="mladenci">
                  <input type="checkbox" id="mladenci" />
                  <label for="mladenci">Mladenci</label>
                  <div class="pjesme-polja"></div>
                </li>
              </ul>
            </div>
            <!-- Dodaj ovo ispod ulaz-odabir-container, a iznad pjesme za drugi ples -->
            <div class="form-group">
              <label for="prvi-ples">Pjesma za prvi ples mladenaca</label>
              <input
                type="text"
                id="prvi-ples"
                name="prvi-ples"
                maxlength="80"
                placeholder="Naziv pjesme"
              />
              <label for="prvi-ples-link" class="visually-hidden"
                >YouTube link (opcionalno)</label
              >
              <input
                type="url"
                id="prvi-ples-link"
                name="prvi-ples-link"
                maxlength="200"
                placeholder="YouTube link (opcionalno)"
              />
            </div>
            <div class="form-group">
              <label for="drugi-ples">Pjesma za drugi ples</label>
              <input
                type="text"
                id="drugi-ples"
                name="drugi-ples"
                maxlength="80"
                placeholder="Naziv pjesme"
              />
              <label for="drugi-ples-link" class="visually-hidden"
                >YouTube link (opcionalno)</label
              >
              <input
                type="url"
                id="drugi-ples-link"
                name="drugi-ples-link"
                maxlength="200"
                placeholder="YouTube link (opcionalno)"
              />
            </div>
            <div class="form-group">
              <label for="molitva">Ima li molitva i tko moli?</label>
              <input
                type="text"
                id="molitva"
                name="molitva"
                maxlength="100"
                placeholder="Npr. Da, moli kum..."
              />
            </div>
            <div class="form-group">
              <label for="hrvatska-himna">Hrvatska himna?</label>
              <select id="hrvatska-himna" name="hrvatska-himna" required>
                <option value="">Odaberite</option>
                <option value="da">Da</option>
                <option value="ne">Ne</option>
              </select>
            </div>
            <div class="form-group">
              <label for="hb-himna">Himna Herceg-Bosne?</label>
              <select id="hb-himna" name="hb-himna" required>
                <option value="">Odaberite</option>
                <option value="da">Da</option>
                <option value="ne">Ne</option>
              </select>
            </div>
            <div class="form-group">
              <label for="torta">Torta?</label>
              <select id="torta" name="torta" required>
                <option value="">Odaberite</option>
                <option value="da">Da</option>
                <option value="ne">Ne</option>
              </select>
            </div>
            <div class="form-group">
              <label for="buket-pjesma">Pjesma za bacanje buketa</label>
              <input
                type="text"
                id="buket-pjesma"
                name="buket-pjesma"
                maxlength="80"
                placeholder="Naziv pjesme"
              />
              <label for="buket-link" class="visually-hidden"
                >YouTube link (opcionalno)</label
              >
              <input
                type="url"
                id="buket-link"
                name="buket-link"
                maxlength="200"
                placeholder="YouTube link (opcionalno)"
              />
            </div>
            <div class="form-group">
              <label for="kravata-pjesma">Pjesma za bacanje kravate</label>
              <input
                type="text"
                id="kravata-pjesma"
                name="kravata-pjesma"
                maxlength="80"
                placeholder="Naziv pjesme"
              />
              <label for="kravata-link" class="visually-hidden"
                >YouTube link (opcionalno)</label
              >
              <input
                type="url"
                id="kravata-link"
                name="kravata-link"
                maxlength="200"
                placeholder="YouTube link (opcionalno)"
              />
            </div>
            <div class="form-group">
              <label for="dj">Hoće li mladenci DJ-a?</label>
              <select id="dj" name="dj" required>
                <option value="">Odaberite</option>
                <option value="da">Da, želimo DJ-a</option>
                <option value="ne">Ne, ne želimo DJ-a</option>
                <option value="svoj">Imamo svog DJ-a</option>
              </select>
            </div>
            <div class="form-group">
              <label for="zanrovi">Koje žanrove preferirate?</label>
              <input
                type="text"
                id="zanrovi"
                name="zanrovi"
                maxlength="120"
                placeholder="Npr. zabavna, narodna, pop, rock..."
              />
            </div>
            <div class="form-group">
              <label for="zeljene-pjesme">Dodatne pjesme koje želite</label>
              <textarea
                id="zeljene-pjesme"
                name="zeljene-pjesme"
                rows="2"
                maxlength="300"
              ></textarea>
            </div>
            <div class="form-group">
              <label for="nezeljene-pjesme">Pjesme koje ne želite</label>
              <textarea
                id="nezeljene-pjesme"
                name="nezeljene-pjesme"
                rows="2"
                maxlength="300"
              ></textarea>
            </div>
            <div class="form-group">
              <label for="roditelji">Imaju li roditelje?</label>
              <select id="roditelji" name="roditelji" required>
                <option value="">Odaberite</option>
                <option value="da">Da</option>
                <option value="ne">Ne</option>
              </select>
            </div>
            <div class="form-group">
              <label for="cijena">Dogovorena cijena</label>
              <input type="text" id="cijena" name="cijena" maxlength="40" />
            </div>
            <div class="form-group">
              <label for="kapara">Kapara</label>
              <input type="text" id="kapara" name="kapara" maxlength="40" />
            </div>
            <div class="form-group">
              <label for="napomena">Dodatne napomene</label>
              <textarea
                id="napomena"
                name="napomena"
                rows="2"
                maxlength="300"
              ></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="obrazac-btn">Pošalji obrazac</button>
            </div>
            <div id="obrazac-poruka"></div>
          </form>
        </div>
      </section>
